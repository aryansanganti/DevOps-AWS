version: 0.2

phases:
  install:
    commands:
      - pip install flake8 pytest
  pre_build:
    commands:
      - echo "Linting..."
      - flake8 app.py test_app.py --max-line-length=100
      - echo "Running unit tests..."
      - pytest -v
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $(echo $ECR_URI | cut -d/ -f1)
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
  build:
    commands:
      - docker build -t $ECR_URI:$IMAGE_TAG -t $ECR_URI:latest .
  post_build:
    commands:
      - docker push $ECR_URI:$IMAGE_TAG
      - docker push $ECR_URI:latest
      - echo "Pushed $ECR_URI:$IMAGE_TAG"
